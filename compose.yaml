name: meridian

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    restart: unless-stopped



    environment:
      WATCHFILES_FORCE_POLLING: "true"

  db:
    image: postgis/postgis:17-3.5
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped


  worker:
    build: .
    env_file: .env
    depends_on:
      - db
    command: python -m app.worker
    volumes:
      - ./app:/app/app
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
