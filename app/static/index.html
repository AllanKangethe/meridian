<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meridian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="icon" href="images/favicon/favicon.ico" type="image/x-icon">

    <script src="scripts/app.js" defer></script>


</head>
<body>
    
    <div class="brand">
        <a href="/">
            <img src="images/icons/globe.png" style="height:25px;">
            <p style="font-size:25px;">Meridian</p>
        </a>
    </div>


    <p style="
        text-align:center;
        color: var(--text);
        font-size:30px;
        margin: 0px;
        cursor: default;">Where do you want to check?
    </p>

    <form id="search-form">
        <label class="search">
            <img class="search-icon" src="images/icons/search.png" alt="" width="18" height="18">
            <input class="search-input" type="search" name="q" placeholder="City, country, or coordinates">
        </label>
    </form> 

    <div class="dashboard">
        <div class="dashboard-map" id="map">

        </div>
       
        <div class="dashboard-sidebar">
             <p style="text-align: center;" id="search-status">Showing Results (0)</p>
             <div class="chips">
                <button class="chip active" data-type="all">All</button>
                <button class="chip" data-type="earthquake">Earthquake</button>
                <button class="chip" data-type="wildfire">Wildfire</button>
                <button class="chip" data-type="temperature extremes">Extreme Temperatures</button>
                <button class="chip" data-type="floods">Floods</button>
                <button class="chip" data-type="severe storm">Severe Storms</button>
                <!-- ... -->
            </div>

            <button id="open-zones" class="chip zone-open">+ Watch zones</button>

             
            <ul id="results">
                <li class="result"></li>
            </ul>

        </div>

        


    </div>

    <aside id="zone-panel" class="zone-panel" aria-hidden="true">
        <div class="zone-panel-header">
            <h2>Watch zones</h2>
            <button id="close-zones" class="chip" aria-label="Close">✕</button>
        </div>
        <form id="zone-form" class="zone-form">
            <label>Name <input name="name" required maxlength="100"></label>
            <label>Latitude <input name="lat" type="number" step="any" min="-90" max="90" required></label>
            <label>Longitude <input name="lon" type="number" step="any" min="-180" max="180" required></label>
            <label>Radius (km) <input name="radius_km" type="number" step="any" min="1" max="2000" value="200" required></label>
            <label>Min magnitude <input name="min_magnitude" type="number" step="0.1" min="0" max="10" value="0"></label>
            <button type="submit" class="chip">Create zone</button>
            <p id="zone-status"></p>
        </form>
        <ul id="zone-list"></ul>
    </aside>

    

    <p class="footer">Data: 
        NASA EONET ·
        USGS · 
        Map © OpenStreetMap contributors · 
        Built by <a class="link" href="https://www.allankangethe.com">Allan Kangethe</a> · 
        <a class="link" href="https://github.com/AllanKangethe/meridian">Github</a>
    </p>

</body>
</html>
